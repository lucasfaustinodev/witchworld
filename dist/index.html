<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#080e20">
  <title>Witch World — Jardim e cabana</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="scene" role="application" tabindex="0" aria-label="Witch World. WASD ou setas para caminhar; Shift para caminhada rápida. E no círculo inicia ou encerra o ritual, e na margem do lago abre ou fecha a vidência. V entra e sai do Véu. E na porta da cabana entra no interior; E na passagem interna volta ao Jardim."></main>
  <p id="meditate-hint" hidden>E — Meditar</p>
  <p id="status" role="status">Preparando o jardim…</p>
  <script type="module">
    import('./main.js').catch(error => {
      document.querySelector('#status').textContent = 'Não foi possível renderizar. Abra por um servidor local e confira o suporte a WebGL 2 do navegador.';
      console.error(error);
    });
  </script>
</body>
</html>
